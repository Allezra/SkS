                document.getElementById('searchInput').focus();
                return;
            }
            navigate('pencarian', value);
        });

        document.addEventListener('click', function (e) {
            
            // Tangkap klik tombol "Muat Lebih Banyak"
            const loadMoreBtn = e.target.closest('[data-load-more]');
            if (loadMoreBtn) {
                e.preventDefault();
                loadMoreBtn.innerHTML = '<span class="h-4 w-4 animate-spin rounded-full border-2 border-white/20 border-t-white"></span> Memuat...';
                if (state.view === 'beranda') {
                    renderHome(state.page + 1);
                } else if (state.view === 'pencarian') {
                    renderSearch(state.searchQuery, state.page + 1);
                }
                return;
            }

            const bookmarkBtn = e.target.closest('[data-bookmark]');
            if (bookmarkBtn) {
                e.preventDefault();
                e.stopPropagation();
                const manga = state.mangaMap.get(bookmarkBtn.getAttribute('data-bookmark'));
                if (manga) {
                    const saved = toggleBookmark(manga);
                    syncBookmarkButtons();
                    updateDetailBookmark();
                    toast(saved ? 'Ditambahkan ke komik tersimpan' : 'Dihapus dari komik tersimpan', saved ? 'success' : 'info');
                }
                return;
            }

            const backBtn = e.target.closest('[data-back]');
            if (backBtn) {
                e.preventDefault();
                navigate(state.returnView || 'beranda', state.returnQuery || '');
                return;
            }

            const navBtn = e.target.closest('[data-nav]');
            if (navBtn) {
                e.preventDefault();
                navigate(navBtn.getAttribute('data-nav'));
                return;
            }

            const feature = e.target.closest('[data-feature-index]');
            if (feature) {
                e.preventDefault();
                const index = parseInt(feature.getAttribute('data-feature-index'), 10) || 0;
                state.featuredIndex = index;
                const wrap = document.getElementById('hero-wrap');
                if (wrap) wrap.innerHTML = heroHTML(state.home[index]);
                return;
            }

            const chapterBtn = e.target.closest('[data-chapter-key]');
            if (chapterBtn) {
                e.preventDefault();
                const chapter = state.chapterMap.get(chapterBtn.getAttribute('data-chapter-key'));
                if (chapter) openReader(chapter);
                return;
            }

            const card = e.target.closest('[data-manga-key]');
            if (card) {
                e.preventDefault();
                const manga = state.mangaMap.get(card.getAttribute('data-manga-key'));
                if (manga) openDetail(manga);
                return;
            }

            const retry = e.target.closest('[data-retry]');
            if (retry) {
                e.preventDefault();
                navigate(state.view === 'detail' ? 'beranda' : state.view, state.searchQuery);
            }
        });

        document.addEventListener('keydown', function (e) {
            const tag = (document.activeElement && document.activeElement.tagName) || '';
            const typing = /INPUT|TEXTAREA|SELECT/.test(tag);

            if (e.key === '/' && !typing) {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                return;
            }

            if (readerUI.classList.contains('hidden')) {
                if ((e.key === 'Enter' || e.key === ' ') && e.target === document.activeElement) {
                    const card = e.target.closest && e.target.closest('[data-manga-key]');
                    if (card && card === e.target) {
                        e.preventDefault();
                        openDetail(state.mangaMap.get(card.getAttribute('data-manga-key')));
                    }
                }
                return;
            }

            if (e.key === 'Escape') {
                backToDetail();
            } else if (e.key === 'ArrowLeft' && state.readerPrev) {
                openReader(state.readerPrev);
            } else if (e.key === 'ArrowRight' && state.readerNext) {
                openReader(state.readerNext);
            }
        });

        document.getElementById('readerBack').addEventListener('click', backToDetail);
        document.getElementById('readerList').addEventListener('click', backToDetail);
        document.getElementById('reader-pages').addEventListener('click', function (e) {
            if (e.target.closest('button')) return;
            toggleReaderUI();
        });
        document.getElementById('btn-prev-chap').addEventListener('click', function (e) {
            e.stopPropagation();
            if (state.readerPrev) openReader(state.readerPrev);
        });
        document.getElementById('btn-next-chap').addEventListener('click', function (e) {
            e.stopPropagation();
            if (state.readerNext) openReader(state.readerNext);
        });

        let progressQueued = false;
        window.addEventListener('scroll', function () {
            if (progressQueued) return;
            progressQueued = true;
            requestAnimationFrame(function () {
                progressQueued = false;
                updateReaderProgress();
            });
        }, { passive: true });

        /* =====================================================================
           INISIALISASI
        ===================================================================== */
        setActiveNav('beranda');
        navigate('beranda');
    </script>
</body>
</html>
